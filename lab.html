<!DOCTYPE html>
<html lang="es">
<head>
<script src="base.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FRANKY LAB — Iniciando Gemelo Digital</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0d1220; color: #e6f7f4; display: flex;
         align-items: center; justify-content: center; height: 100vh; margin: 0; }
  .box { text-align: center; max-width: 460px; padding: 24px; }
  .spinner { width: 36px; height: 36px; border: 3px solid #234; border-top-color: #00cdb3;
             border-radius: 50%; margin: 0 auto 16px; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { opacity: 0.75; font-size: 14px; }
  .err { color: #ff6b6b; white-space: pre-wrap; text-align: left; font-family: monospace; font-size: 12px; }
</style>
</head>
<body>
<div class="box">
  <div class="spinner" id="spinner"></div>
  <div id="msg">Preparando el Gemelo Digital de FRANKY…</div>
  <p>Registrando el Servidor Virtual (Service Worker) antes de abrir la interfaz original.</p>
</div>
<script>
// IMPORTANTE — este archivo NO se llama index.html a propósito: el
// index.html real, en la raíz de este mismo sitio, es el archivo ORIGINAL
// de FRANKY, sin modificar. Este bootstrap solo hace falta la PRIMERA vez
// que se visita el sitio en un navegador — una vez que el Service Worker
// queda activo, las siguientes visitas a index.html ya quedan controladas
// automáticamente, sin pasar por acá (ver el parche de arranque que
// build/copy-to-public.mjs le agrega a la COPIA de index.html).
const msg = document.getElementById("msg");
const spinner = document.getElementById("spinner");

function fail(text) {
  spinner.style.display = "none";
  msg.classList.add("err");
  msg.textContent = text;
}

async function start() {
  if (!("serviceWorker" in navigator)) {
    fail("Este navegador no soporta Service Workers.");
    return;
  }
  if (location.protocol !== "http:" && location.protocol !== "https:") {
    fail("Los Service Workers no funcionan sobre file://. Serví esta carpeta con un servidor HTTP (ej. 'npx serve public').");
    return;
  }
  try {
    // Registro PORTABLE: ruta relativa, sin scope forzado. El navegador
    // calcula el scope por defecto como el directorio que contiene a
    // sw.js — que es, siempre, la raíz real de la app (sea la raíz del
    // dominio o cualquier subdirectorio), sin que este código necesite
    // saber cuál de las dos es. Mismo principio que base.js, aplicado
    // al registro del Service Worker en vez de a fetch()/navegación.
    const reg = await navigator.serviceWorker.register(resolveUrl("sw.js"), { type: "module" });
    await reg.update().catch(() => {}); // fuerza el chequeo de actualización ahora, no en el próximo ciclo del navegador
    await navigator.serviceWorker.ready;
    if (navigator.serviceWorker.controller) {
      location.replace(resolveUrl("lab.html"));
      return;
    }
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      location.replace(resolveUrl("lab.html"));
    });
    setTimeout(() => {
      if (!navigator.serviceWorker.controller) {
        msg.textContent = "El Service Worker está activo pero aún no controla esta pestaña. Recargá la página.";
      }
    }, 1500);
  } catch (err) {
    // Causa más común hoy: el hosting no sirve Service Workers sobre
    // HTTPS/localhost (algunos hostings estáticos gratuitos sin TLS), o
    // el archivo sw.js realmente no está publicado. Ya NO depende de si
    // el sitio está en la raíz del dominio o en un subdirectorio — eso
    // se resuelve solo (ver base.js) — así que ese caso se sacó de este
    // mensaje de error.
    let hint = "";
    try {
      const probe = await fetch(resolveUrl("sw.js"));
      if (!probe.ok) {
        hint =
          "\n\nCAUSA PROBABLE: " + resolveUrl("sw.js") + " no respondió con un archivo válido.\n" +
          "Confirmá que este sitio se publicó completo (incluido sw.js y la carpeta _lab/), " +
          "y que el hosting sirve HTTPS (o que estás en localhost) — los Service Workers no " +
          "funcionan en HTTP plano fuera de localhost.";
      }
    } catch {
      /* si ni siquiera el fetch de sondeo funciona, mostramos solo el error original */
    }
    fail("No se pudo registrar el Service Worker:\n" + err + hint);
  }
}

start();
</script>
</body>
</html>
